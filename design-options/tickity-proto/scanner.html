<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сканер · Tickity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Wix+Madefor+Display:wght@700;800&family=Wix+Madefor+Text:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Sofia+Sans+Extra+Condensed:wght@800;900&family=Sofia+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
  .col { max-width: 440px; min-height: 100vh; min-height: 100svh; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
  .bar { display: flex; align-items: center; gap: 12px; }
  .bar b { display: block; font-family: var(--head); font-weight: var(--head-w); text-transform: var(--head-tt); font-size: calc(18px * var(--head-scale)); line-height: 1.1; }
  .bar span { font-size: 13px; color: var(--mist); }
  .bar a { margin-left: auto; font-weight: 700; font-size: 14px; padding: 10px 4px; }
  .view { flex: 1; min-height: 430px; position: relative; border-radius: 28px; background: var(--bg-2); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; text-align: center; }
  .state { display: contents; }
  .state[hidden] { display: none; }
  /* camera */
  .cam { position: absolute; inset: 0; background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .08), transparent 60%), linear-gradient(180deg, rgba(0, 0, 0, .25), rgba(0, 0, 0, .55)); }
  .frame { position: relative; width: 210px; height: 210px; }
  .frame i { position: absolute; width: 46px; height: 46px; border: 5px solid var(--accent); }
  .frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 16px 0 0 0; }
  .frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 16px 0 0; }
  .frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 16px; }
  .frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 16px 0; }
  .frame .line { position: absolute; left: 12px; right: 12px; height: 3px; top: 12px; background: var(--accent); box-shadow: 0 0 18px 4px rgba(var(--glow), .55); animation: sweep 1.6s ease-in-out infinite alternate; }
  @keyframes sweep { to { top: calc(100% - 15px); } }
  .frame.lock i { animation: lock .35s ease forwards; }
  @keyframes lock { to { width: 34px; height: 34px; margin: 18px; } }
  .hint { position: relative; color: var(--mist); font-size: 15px; max-width: 260px; }
  /* result */
  .burst { position: relative; width: 140px; height: 140px; margin-bottom: 6px; flex: none; }
  @media (max-height: 720px) { .burst { width: 108px; height: 108px; } .burst svg { width: 54px; height: 54px; } }
  .burst .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--accent); animation: ring 1.2s ease-out infinite; }
  @keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
  .burst .dot { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; animation: pop .55s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  .big { font-size: calc(clamp(36px, 10vw, 46px) * var(--head-scale)); }
  .who { font-size: 18px; color: var(--mist); margin-top: -10px; }
  .row8 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 7px; width: 100%; max-width: 290px; }
  .row8 span { aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); transition: background .3s, border-color .3s; }
  .row8 span.on { background: var(--fg); border-color: var(--fg); }
  .row8 span.new { background: var(--accent); border-color: var(--accent); animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  .muted { color: var(--mist); font-size: 14px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn-xl { min-height: 66px; font-size: 18px; border-radius: 20px; }
  .two { display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%; max-width: 320px; }
</style>
</head>
<body>
<main class="col pt-rise">
  <div class="bar">
    <span class="ava" style="background:var(--accent);color:var(--on-accent)">Л</span>
    <div><b>Barber «Лезо»</b><span>Сканер · працівник Максим</span></div>
    <a href="index.html">Вийти</a>
  </div>

  <div class="view" aria-live="polite">
    <div class="state" id="sScan">
      <div class="cam" aria-hidden="true"></div>
      <div class="frame" id="frame" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="line"></span></div>
      <p class="hint">Наведіть камеру на QR-код у телефоні клієнта</p>
    </div>
    <div class="state" id="sDone" hidden>
      <div class="burst"><span class="ring"></span><span class="dot"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
      <h1 class="h big">Штамп додано</h1>
      <p class="who" id="who">Олена · 6 з 8 візитів</p>
      <div class="row8" id="row" aria-hidden="true"></div>
      <p class="muted" id="left">До подарунка ще 2 візити</p>
    </div>
    <div class="state" id="sGift" hidden>
      <div class="burst"><span class="ring"></span><span class="dot"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg></span></div>
      <h1 class="h big">Картка заповнена</h1>
      <p class="who">Олена · 8 з 8 · стрижка в подарунок</p>
      <div class="two"><button type="button" class="btn btn-accent btn-xl" id="give">Видати подарунок</button><button type="button" class="btn btn-ghost btn-xl" id="later">Пізніше</button></div>
    </div>
    <div class="state" id="sGiven" hidden>
      <h1 class="h big">Подарунок <em class="a">видано</em></h1>
      <p class="who">Картка Олени почалася знову</p>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-light btn-xl" id="main">Імітувати скан (демо)</button>
    <button type="button" class="btn btn-ghost" id="manual">Ввести код вручну</button>
  </div>
</main>

<script>
(function () {
  var TOTAL = 8, n = 5, stateName = 'scan';
  var row = document.getElementById('row'), dots = [];
  for (var i = 0; i < TOTAL; i++) { var s = document.createElement('span'); row.appendChild(s); dots.push(s); }
  var states = { scan: 'sScan', done: 'sDone', gift: 'sGift', given: 'sGiven' };
  var main = document.getElementById('main');
  function show(name) {
    stateName = name;
    Object.keys(states).forEach(function (k) { document.getElementById(states[k]).hidden = k !== name; });
    main.textContent = name === 'scan' ? 'Імітувати скан (демо)' : 'Сканувати наступного';
    main.hidden = name === 'gift';
    document.getElementById('manual').hidden = name !== 'scan';
  }
  function stamp() {
    var f = document.getElementById('frame');
    f.classList.add('lock');
    setTimeout(function () {
      f.classList.remove('lock');
      n++;
      if (n >= TOTAL) { show('gift'); window.TK.chips(document.querySelector('#sGift .dot'), 8, { jitter: 80, spread: 520, fall: 420, stagger: 60 }); return; }
      dots.forEach(function (d, i) { d.className = i < n - 1 ? 'on' : (i === n - 1 ? 'new' : ''); });
      document.getElementById('who').textContent = 'Олена · ' + n + ' з 8 візитів';
      var left = TOTAL - n;
      document.getElementById('left').textContent = 'До подарунка ще ' + left + (left === 1 ? ' візит' : ' візити');
      show('done');
      window.TK.chips(document.querySelector('#sDone .dot'), 3, { stagger: 90 });
    }, window.TK.reduce ? 0 : 420);
  }
  main.addEventListener('click', function () { if (stateName === 'scan') stamp(); else show('scan'); });
  document.getElementById('give').addEventListener('click', function () { n = 0; show('given'); });
  document.getElementById('later').addEventListener('click', function () { show('scan'); });
  show('scan');
})();
</script>
</body>
</html>
