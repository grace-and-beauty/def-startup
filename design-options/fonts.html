<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickity — 20 шрифтів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&family=Manrope:wght@400;600;800&family=Montserrat+Alternates:wght@600;700&family=Montserrat:wght@400;600&family=Rubik:wght@400;600;800&family=Sofia+Sans+Extra+Condensed:wght@800&family=Sofia+Sans:wght@400;600&family=Dela+Gothic+One&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@600;800&family=Wix+Madefor+Text:wght@400;600&family=Comfortaa:wght@700&family=Nunito:wght@400;700&family=Jost:wght@400;600;700&family=Exo+2:wght@400;600;800&family=Russo+One&family=IBM+Plex+Sans:wght@400;600&family=Tenor+Sans&family=Commissioner:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Literata:wght@400;600;700&family=Yeseva+One&family=Mulish:wght@400;700&family=Prata&family=Raleway:wght@400;600&family=Oswald:wght@500;700&family=Roboto:wght@400;600&family=Bitter:wght@400;600;800&family=Tektur:wght@500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#F1F2F4;color:#15171C;font-family:system-ui,sans-serif;padding:0 16px 60px}
  .intro{max-width:1180px;margin:0 auto;padding:28px 0 8px;font-size:15px;line-height:1.5;color:#555}
  .intro b{color:#15171C}
  .jump{max-width:1180px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:0;background:#F1F2F4;padding:10px 0;z-index:2}
  .jump a{font:600 13px system-ui;color:#15171C;text-decoration:none;background:#fff;border:1px solid #DDE0E5;border-radius:8px;padding:6px 9px}
  .jump a:hover{background:#15171C;color:#fff}
  .opt{max-width:1180px;margin:34px auto 0;scroll-margin-top:70px}
  .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-family:system-ui}
  .num{font:700 13px system-ui;background:#15171C;color:#fff;border-radius:6px;padding:4px 8px}
  .names{font-weight:600;font-size:15px}
  .mood{color:#6A707C;font-size:14px}
  .row{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:12px}
  @media (max-width:900px){.row{grid-template-columns:1fr}}
  .panel{background:#fff;border:1px solid #E2E4E8;border-radius:16px;padding:22px;position:relative;min-width:0}
  .where{position:absolute;top:10px;right:12px;font:500 11px system-ui;color:#9AA0AA;letter-spacing:.04em;text-transform:uppercase}
  /* location 1: home hero */
  .hero h2{font-family:var(--d);font-weight:var(--dw);font-size:clamp(30px,3.3vw,42px);line-height:1.05;letter-spacing:var(--ls,-.01em);text-transform:var(--tt,none);margin-top:10px}
  .hero p{font-family:var(--b);font-size:15px;line-height:1.5;color:#5A606B;margin:12px 0 16px}
  .btn{display:inline-block;font-family:var(--b);font-weight:600;font-size:14px;background:#15171C;color:#fff;border-radius:10px;padding:11px 16px}
  /* location 2: customer card */
  .card{background:#16181D;color:#fff;border-radius:18px;padding:20px;margin-top:10px}
  .card .bn{font-family:var(--d);font-weight:var(--dw);font-size:26px;line-height:1.05;letter-spacing:var(--ls,-.01em);text-transform:var(--tt,none)}
  .card .rw{font-family:var(--b);font-size:13px;color:#A9AEB8;margin:6px 0 16px}
  .card .big{font-family:var(--d);font-weight:var(--dw);font-size:44px;line-height:1;letter-spacing:var(--ls,-.01em)}
  .card .big small{font-family:var(--b);font-weight:400;font-size:15px;color:#A9AEB8;letter-spacing:0;margin-left:6px}
  .dots{display:flex;gap:7px;margin-top:14px}
  .dots i{flex:1;aspect-ratio:1;border-radius:50%;border:1.5px solid #ffffff44}
  .dots i.on{background:#fff;border-color:#fff}
  /* location 3: dashboard */
  .dash{font-family:var(--b);margin-top:10px}
  .dash h3{font-family:var(--d);font-weight:var(--dw);font-size:22px;letter-spacing:var(--ls,-.01em);text-transform:var(--tt,none);margin-bottom:12px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:#F5F6F8;border-radius:12px;padding:12px}
  .stat b{display:block;font-family:var(--d);font-weight:var(--dw);font-size:28px;line-height:1.1}
  .stat span{font-size:12.5px;color:#6A707C}
  .line{display:flex;justify-content:space-between;font-size:13.5px;padding:10px 2px 0;margin-top:10px;border-top:1px solid #EEF0F2}
  .line em{font-style:normal;color:#6A707C}
</style>
</head>
<body>
<p class="intro"><b>20 шрифтів для Tickity.</b> Кожен показано в трьох місцях сайту: заголовок головної сторінки, картка клієнта в телефоні, кабінет закладу з цифрами. Кольори навмисно нейтральні — дивіться лише на шрифт. Напишіть номери, що сподобались (наприклад «4, 9, 12»).</p>
<nav class="jump" id="jump"></nav>
<main id="list"></main>

<script>
const F=[
 ["Geologica","Geologica",700,"Geologica","Сучасний, геометричний, трохи технологічний"],
 ["Manrope","Manrope",800,"Manrope","Чистий і впевнений, як сучасні фінтех-застосунки"],
 ["Montserrat Alternates","Montserrat Alternates",700,"Montserrat","Круглий, з характерними літерами — грайливий"],
 ["Rubik","Rubik",800,"Rubik","М'які заокруглені кути — дружній і теплий"],
 ["Sofia Sans Extra Condensed","Sofia Sans Extra Condensed",800,"Sofia Sans","Високий вузький, як на афішах і квитках",{tt:"uppercase",ls:"0"}],
 ["Dela Gothic One","Dela Gothic One",400,"Golos Text","Дуже жирний і гучний — помітний здалеку"],
 ["Wix Madefor Display","Wix Madefor Display",800,"Wix Madefor Text","Акуратний, сучасний, легко читається"],
 ["Comfortaa","Comfortaa",700,"Nunito","Округлий і легкий — ніжний, «кавʼярняний»"],
 ["Jost","Jost",600,"Jost","Класична геометрія в дусі Bauhaus — стильно"],
 ["Exo 2","Exo 2",800,"Exo 2","Спортивний, динамічний, трохи футуристичний"],
 ["Russo One","Russo One",400,"IBM Plex Sans","Міцний і квадратний — «чоловічий», для барберів"],
 ["Tenor Sans","Tenor Sans",400,"Commissioner","Тонкий і елегантний — салони краси, спа",{ls:".01em"}],
 ["Cormorant Garamond","Cormorant Garamond",700,"Golos Text","Класична книжкова антиква — розкіш, бутик"],
 ["Literata","Literata",700,"Literata","Сучасна антиква — розумно й надійно"],
 ["Yeseva One","Yeseva One",400,"Mulish","Виразна контрастна антиква — жіночно, модно"],
 ["Prata","Prata",400,"Raleway","Витончена антиква — дорогий ресторан, ювелірка"],
 ["Oswald","Oswald",700,"Roboto","Вузький щільний гротеск — спорт, вулиця",{tt:"uppercase",ls:".01em"}],
 ["Bitter","Bitter",800,"Bitter","Шрифт із «засічками-цеглинками» — ремесло, крафт"],
 ["Tektur","Tektur",700,"Golos Text","Технічний, з гранями — як табло чи гаджет"],
 ["Caveat","Caveat",700,"Nunito","Рукописний — ніби майстер написав від руки",{ls:"0"}],
];
const list=document.getElementById('list'),jump=document.getElementById('jump');
F.forEach(([label,d,dw,b,mood,o={}],i)=>{
  const n=String(i+1);
  const s=document.createElement('section');s.className='opt';s.id='f'+n;
  s.style.cssText=`--d:"${d}";--dw:${dw};--b:"${b}";${o.tt?`--tt:${o.tt};`:''}${o.ls?`--ls:${o.ls};`:''}`;
  s.innerHTML=`
  <div class="head"><span class="num">${n}</span><span class="names">${label}${b!==d?' + '+b:''}</span><span class="mood">${mood}</span></div>
  <div class="row">
    <div class="panel hero"><span class="where">Головна</span>
      <h2>Картка лояльності, яку клієнт не загубить</h2>
      <p>Клієнт сканує QR — і картка вже в телефоні. Без застосунків і паперових карток.</p>
      <span class="btn">Спробувати 30 днів безкоштовно</span></div>
    <div class="panel"><span class="where">Картка клієнта</span>
      <div class="card"><div class="bn">Барбершоп Бритва</div><div class="rw">6 візитів → стрижка в подарунок</div>
      <div class="big">4<small>з 6 штампів</small></div><div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div></div></div>
    <div class="panel dash"><span class="where">Кабінет</span>
      <h3>Огляд за тиждень</h3>
      <div class="stats"><div class="stat"><b>1 248</b><span>Клієнтів</span></div><div class="stat"><b>63</b><span>Візитів</span></div></div>
      <div class="line"><span>Олена Коваль</span><em>4 з 6 · вчора</em></div>
      <div class="line"><span>Андрій Шевчук</span><em>подарунок · 12.10</em></div></div>
  </div>`;
  list.appendChild(s);
  const a=document.createElement('a');a.href='#f'+n;a.textContent=n;a.title=label;jump.appendChild(a);
});
</script>
</body>
</html>
